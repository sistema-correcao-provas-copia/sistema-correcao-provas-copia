services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../pi2-2026-2-equipe-6-back
    container_name: backend_app
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ../pi2-2026-2-equipe-6-back:/app
    depends_on:
      - postgres

  frontend:
    build:
      context: ../pi2-2026-2-equipe-6-front
    container_name: frontend_app
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:8501"
    volumes:
      - ../pi2-2026-2-equipe-6-front:/app
    depends_on:
      - backend

volumes:
  pgdata: